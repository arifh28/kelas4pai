<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soal Ujian - PAI Kelas 4</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f4f8; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .option-label { display: block; padding: 15px; border: 2px solid #e9ecef; border-radius: 8px; cursor: pointer; transition: all 0.2s; background: #fff; }
        .option-label:hover { border-color: #0d6efd; background-color: #f8faff; }
        .option-label input[type="radio"] { margin-right: 10px; transform: scale(1.2); cursor: pointer; }
        input[type="text"] { border: 2px solid #e9ecef; border-radius: 8px; padding: 15px; font-size: 16px; }
        input[type="text"]:focus { border-color: #0d6efd; box-shadow: none; }
        .progress { height: 8px; border-radius: 4px; }
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 700px;">
        <div class="card border-top border-primary border-4">
            <div class="card-body p-4 p-md-5">
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="badge bg-primary text-white p-2 px-3 rounded-pill fs-6" id="questionBadge">Soal 1/35</span>
                    <span class="text-muted small fw-semibold" id="siswaInfo"></span>
                </div>
                
                <div class="progress mb-4 bg-primary-subtle">
                    <div class="progress-bar bg-primary" id="progressBar" role="progressbar" style="width: 2.8%"></div>
                </div>

                <h4 class="fw-bold text-dark mb-4" id="questionText" style="line-height: 1.6;"></h4>
                <div id="answerArea" class="mb-5 d-flex flex-column gap-3"></div>

                <div class="d-flex justify-content-between pt-3 border-top">
                    <button id="btnPrev" class="btn btn-outline-secondary px-4 fw-semibold" onclick="prevQuestion()">
                        <i class="fa-solid fa-arrow-left me-2"></i> Sebelumnya
                    </button>
                    <button id="btnNext" class="btn btn-primary px-4 fw-semibold" onclick="nextQuestion()">
                        Selanjutnya <i class="fa-solid fa-arrow-right ms-2"></i>
                    </button>
                    <button id="btnFinish" class="btn btn-danger px-4 fw-semibold shadow" onclick="finishExam()" style="display:none;">
                        <i class="fa-solid fa-paper-plane me-2"></i> Selesai Ujian
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let answers = JSON.parse(localStorage.getItem('jawaban_ujian_k4')) || {};

        const nama = localStorage.getItem('siswa_nama');
        const kelas = localStorage.getItem('siswa_kelas');

        if(!nama) window.location.href = 'index.html';
        document.getElementById('siswaInfo').innerHTML = `<i class="fa-solid fa-user me-1"></i> ${nama} - ${kelas}`;

        fetch('soal.json')
            .then(res => res.json())
            .then(data => {
                questions = data;
                renderQuestion();
            });

        function renderQuestion() {
            const q = questions[currentIndex];
            const total = questions.length;
            
            document.getElementById('questionBadge').innerText = `Soal ${currentIndex + 1} dari ${total}`;
            document.getElementById('progressBar').style.width = `${((currentIndex + 1) / total) * 100}%`;
            document.getElementById('questionText').innerText = q.q;
            
            const area = document.getElementById('answerArea');
            area.innerHTML = '';

            if(q.type === 'pg') {
                q.a.forEach((opt, idx) => {
                    const checked = answers[q.id] == idx ? 'checked' : '';
                    area.innerHTML += `
                        <label class="option-label text-dark fw-medium">
                            <input type="radio" name="q${q.id}" value="${idx}" onchange="saveAnswer(${q.id}, ${idx})" ${checked}>
                            ${opt}
                        </label>
                    `;
                });
            } else {
                const val = answers[q.id] || '';
                area.innerHTML = `<input type="text" class="form-control" value="${val}" oninput="saveAnswer(${q.id}, this.value)" placeholder="Ketik jawaban uraian Anda...">`;
            }

            document.getElementById('btnPrev').disabled = currentIndex === 0;
            
            if(currentIndex === questions.length - 1) {
                document.getElementById('btnNext').style.display = 'none';
                document.getElementById('btnFinish').style.display = 'block';
            } else {
                document.getElementById('btnNext').style.display = 'block';
                document.getElementById('btnFinish').style.display = 'none';
            }
        }

        function saveAnswer(id, val) {
            answers[id] = val;
            localStorage.setItem('jawaban_ujian_k4', JSON.stringify(answers));
        }

        function nextQuestion() {
            if(currentIndex < questions.length - 1) { currentIndex++; renderQuestion(); }
        }

        function prevQuestion() {
            if(currentIndex > 0) { currentIndex--; renderQuestion(); }
        }

        function finishExam() {
            if(confirm('Apakah Anda yakin sudah selesai dan ingin mengumpulkan jawaban?')) {
                window.location.href = 'hasil.html';
            }
        }
    </script>
</body>
</html>
